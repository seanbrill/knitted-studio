name: release

# Tag v* to build installers for all three systems and attach them to a DRAFT release.
# Nothing is published until a person presses the button on GitHub.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build:app
      - run: npm run desktop:dist -w @knitted/studio
        # Unsigned. When certificates exist, add CSC_LINK / CSC_KEY_PASSWORD (and the Apple
        # notarisation variables) as repository secrets and remove `identity: null` in
        # apps/studio/electron-builder.yml. See docs/RELEASING.md.
      - name: Checksums
        shell: bash
        run: |
          cd dist/desktop
          for f in *.dmg *.zip *.exe *.AppImage *.deb; do [ -f "$f" ] && (shasum -a 256 "$f" 2>/dev/null || sha256sum "$f") >> SHA256SUMS-${{ matrix.os }}.txt; done || true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/desktop/*.dmg
            dist/desktop/*.zip
            dist/desktop/*.exe
            dist/desktop/*.AppImage
            dist/desktop/*.deb
            dist/desktop/SHA256SUMS-*.txt
