# knitted.studio: check the code, publish a new version's installers, build the landing
# site, deploy it.
#
# A version that is not in the FileFreak release folder yet gets its installers built
# here and uploaded (scripts/pipeline-release.mjs): the macOS .zip, the Windows installer
# and the Linux AppImages. Not the macOS .dmg: only macOS makes a disk image, and this
# host is Linux. A Mac makes it with `npm run release` (scripts/release.mjs), which builds
# and uploads every file itself, and uploads before it pushes, so the run that push
# starts finds the version up and leaves it alone. One of the two uploads a version,
# never both: this pipeline once uploaded its Linux build on every run, which replaced
# the Mac's Linux file and cut SHA256SUMS.txt down to one line.
#
# The site's Download page is built from the release folder, so it lists whatever has
# been published when the site is built. Run this by hand when a push had nothing to
# send (npm run release says when).
#
# Variables live in EZPIPELINE, not here: see ci/ezpipeline/knitted-release.env.example.

id: "3b2eb956-3f9f-4901-bd45-cd0bb78b0f32"
appName: "knitted release"
version: 1.0.0
description: >
  Check knitted, publish a new version's installers (all but the macOS .dmg) to the
  FileFreak release folder, build the landing site from it and deploy it. A Mac adds
  the .dmg with npm run release.
group: "Knitted"

steps:
  - name: Preflight
    description: Checks the programs and variables the run needs, before it changes anything.
    shell: /bin/bash
    run: |
      set -euo pipefail
      for tool in git node npm; do command -v "$tool" >/dev/null || { echo "MISSING program: $tool"; exit 1; }; done
      node -e 'process.exit(Number(process.versions.node.split(".")[0]) >= 22 ? 0 : 1)' || { echo "Node 22 or newer is needed, this is $(node -v)"; exit 1; }
      missing=0
      for v in KNITTED_REPO_URL FILEFREAK_SITE_KEY KNITTED_SITE_NAME KNITTED_RELEASE_DOWNLOAD_KEY; do
        [ -n "$(printenv "$v" || true)" ] || { echo "MISSING variable: $v"; missing=1; }
      done
      [ "$missing" = 0 ] || exit 1
      # Provided by EZPIPELINE's "FileFreak CLI" plugin (Settings, Plugins, Install).
      command -v filefreak >/dev/null || { echo "MISSING program: filefreak. Install the FileFreak CLI plugin in EZPIPELINE: Settings, Plugins."; exit 1; }
      filefreak --version

      # Can the site key deploy? Asked now, not after the build. FileFreak lets only an
      # app's own key deploy (made for the app, NOT limited to a folder, and allowed
      # sites:deploy). A folder key, like the one that uploads releases, is refused.
      if ! sites=$(FILEFREAK_KEY="$FILEFREAK_SITE_KEY" filefreak sites list 2>&1); then
        echo "The site cannot be deployed with FILEFREAK_SITE_KEY: $sites"
        echo "Set it to a key made for the app that owns the site, not limited to a folder, allowed sites:deploy."
        exit 1
      fi
      echo "$sites" | grep -qw -- "$KNITTED_SITE_NAME" || { echo "That key's app has no site called $KNITTED_SITE_NAME. It has: $sites"; exit 1; }

  - name: Fetch the code
    shell: /bin/bash
    run: |
      set -euo pipefail
      rm -rf knitted
      git clone --branch "${KNITTED_BRANCH:-main}" --depth 1 "$KNITTED_REPO_URL" knitted
      git -C knitted --no-pager log -1 --format='building %H %s'

  - name: Install and check
    shell: /bin/bash
    cwd: ./knitted
    run: |
      set -euo pipefail
      npm ci
      npm run typecheck
      npm test

  - name: Publish the installers
    description: >
      Only for a version the release folder does not have yet: builds the macOS .zip,
      the Windows installer and the Linux AppImages, signs the Mac app ad-hoc as a Mac
      does, and uploads them with FILEFREAK_KEY. Any other run builds nothing: it says
      whether that key can write, so a bad key shows before the next version, and goes on.
    shell: /bin/bash
    # The app's Next.js build, like the site's, fails in development mode (see below).
    env:
      NODE_ENV: production
    cwd: ./knitted
    run: |
      set -euo pipefail
      # ffmpeg, sharp and rcodesign for each app, downloaded once and kept between runs.
      export KNITTED_DESKTOP_CACHE="$HOME/.cache/knitted-desktop"
      node scripts/pipeline-release.mjs

  - name: Build the site
    description: >
      The build asks FileFreak, with the read-only key, which versions exist and
      writes the Download page from the answer.
    shell: /bin/bash
    # EZPIPELINE's host runs with NODE_ENV=development. Next.js builds in that mode fail
    # on the error pages ("<Html> should not be imported outside of pages/_document"),
    # so the build says production itself. Installs are left alone: they need dev tools.
    env:
      NODE_ENV: production
    cwd: ./knitted
    run: |
      set -euo pipefail
      npm run build:site
      ls dist/site | head

  - name: Deploy the site
    shell: /bin/bash
    cwd: ./knitted
    run: |
      set -euo pipefail
      FILEFREAK_KEY="$FILEFREAK_SITE_KEY" filefreak sites deploy dist/site --site "$KNITTED_SITE_NAME"
